# QingLink 移动端发布流水线
#
# 触发：推送 `mobile-v<版本>` 标签，例如 `mobile-v1.0.0+6`。
# tag 是版本号唯一真相源：CI 校验它与 pubspec.yaml 的语义版本一致，并用
# --build-name / --build-number 覆盖构建，确保 APK 版本与 tag 一致。
#
# 产物：一个 GitHub Release，含两个 asset：
#   QingLink-mobile-<版本>-android.apk
#   QingLink-mobile-<版本>-android.apk.sha256（GNU sha256sum 清单格式）
# 清单文件名跟着 APK 走，是为了让已安装的旧版客户端（按「APK 地址 + .sha256」
# 取校验文件）也能升级；内容仍是标准的「哈希 + 两个空格 + 文件名」多行格式。
# 新客户端优先找 SHA256SUMS，找不到再退回同名 `.sha256`。
# iOS 无法从 GitHub Release 侧载，客户端只做检查 + 打开发布页提示。
#
# 签名：使用仓库内的固定密钥（android/keystore/qinglink-release.jks，配置见
# android/key.properties）。Android 只允许同签名的 APK 覆盖安装，而 runner 每次
# 都是全新的、默认 debug 密钥每次现生成，因此发版前会硬校验签名指纹。

name: 移动端发布

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 tag 版本并校验
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#mobile-v}"
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "tag 格式错误：$TAG，应为 mobile-v<语义版本>+<构建号>" >&2
            exit 1
          fi
          SEMVER="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[2]}"
          PUB_VERSION=$(grep -m1 '^version:' apps/mobile/pubspec.yaml | sed 's/version:[[:space:]]*//')
          if [ "$PUB_VERSION" != "$VERSION" ]; then
            echo "tag 版本 $VERSION 与 pubspec.yaml $PUB_VERSION 不一致" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION（构建号 $BUILD）"

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定版本而非跟随 stable：Flutter 3.47+ 弃用 material.dart 等入口，
      # 会让 flutter analyze 报出 80+ 条 deprecated_member_use 并使构建失败。
      # 升级前需先把全项目导入迁到 material_ui / cupertino_ui，再一并改这里。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: 获取依赖
        working-directory: apps/mobile
        run: flutter pub get

      - name: 静态检查
        working-directory: apps/mobile
        run: flutter analyze

      - name: 构建 Release APK
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SEMVER: ${{ steps.version.outputs.semver }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          flutter build apk --release \
            --build-name "$SEMVER" \
            --build-number "$BUILD"

      # 签名必须来自仓库内的固定密钥（android/keystore/qinglink-release.jks）。
      # 一旦这里退回 debug 密钥，已安装的客户端就会因为签名变化而无法覆盖升级，
      # 所以在发版路径上硬校验指纹，出现偏差就直接失败。
      - name: 校验发布签名
        shell: bash
        env:
          EXPECTED_SHA256: '93:17:DC:EC:24:EE:30:C4:40:F3:BB:27:50:5A:70:E0:0C:46:B0:5F:CA:71:C9:6D:8A:02:6F:AF:A9:D3:08:D7'
        run: |
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          grep -F 'Signer #1 certificate DN' certs.txt
          # apksigner 输出小写十六进制，这里统一成大写再比
          ACTUAL=$(grep -F 'Signer #1 certificate SHA-256 digest' certs.txt | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "APK 签名指纹不符：" >&2
            echo "  期望 $EXPECTED_SHA256" >&2
            echo "  实际 $ACTUAL" >&2
            echo "请检查 android/key.properties 与 keystore/qinglink-release.jks 是否被正确检出。" >&2
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL"

      - name: 组装发布资产
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE=release-assets
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          APK_NAME="QingLink-mobile-$VERSION-android.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$STAGE/$APK_NAME"
          # 在 stage 目录内生成清单，保证文件名为裸名（不含路径）。
          # 清单沿用 GNU sha256sum 多行格式，但文件名取 `$APK_NAME.sha256`：
          # 已安装的旧版客户端按「APK 地址 + .sha256」取校验文件，只读第一行；
          # 文件名换成 SHA256SUMS 会让它们直接 404。多行清单对旧客户端无害
          # （首行就是 APK 的哈希），新客户端则按文件名查表。
          (cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          ls -lh "$STAGE"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QingLink 移动端 ${{ steps.version.outputs.version }}
          body: |
            移动端版本 `${{ steps.version.outputs.version }}`（构建号 ${{ steps.version.outputs.build }}）。

            - Android：下载 `QingLink-mobile-*.apk` 安装；应用内「检查更新」可直接下载并安装。
            - iOS：GitHub Release 不提供可侧载安装包，应用内检查到更新后会提示前往本页。

            `QingLink-mobile-*.apk.sha256` 为校验清单（GNU sha256sum 行格式）。
          files: release-assets/*
          fail_on_unmatched_files: true
