# QingLink 移动端发布流水线
#
# 触发：推送 `mobile-v<版本>` 标签，例如 `mobile-v1.0.0+6`。
# tag 是版本号唯一真相源：CI 校验它与 pubspec.yaml 的语义版本一致，并用
# --build-name / --build-number 覆盖构建，确保 APK 版本与 tag 一致。
#
# 产物：一个 GitHub Release，含两个 asset：
#   QingLink-mobile-<版本>-android.apk
#   QingLink-mobile-<版本>-android.apk.sha256（GNU sha256sum 清单格式）
# 清单文件名跟着 APK 走，是为了让已安装的旧版客户端（按「APK 地址 + .sha256」
# 取校验文件）也能升级；内容仍是标准的「哈希 + 两个空格 + 文件名」多行格式。
# 新客户端优先找 SHA256SUMS，找不到再退回同名 `.sha256`。
# iOS 无法从 GitHub Release 侧载，客户端只做检查 + 打开发布页提示。
#
# 签名：使用仓库内的固定密钥（android/keystore/qinglink-release.jks，配置见
# android/key.properties）。Android 只允许同签名的 APK 覆盖安装，而 runner 每次
# 都是全新的、默认 debug 密钥每次现生成，因此发版前会硬校验签名指纹。
#
# 体积：只打 android-arm / android-arm64（真机 ABI）。universal 包还会带 x86_64
# 引擎，仅模拟器会用；去掉后包体从 ~58 MB 降到 ~36 MB，慢链路下更不容易被截断。

name: 移动端发布

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 tag 版本并校验
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#mobile-v}"
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "tag 格式错误：$TAG，应为 mobile-v<语义版本>+<构建号>" >&2
            exit 1
          fi
          SEMVER="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[2]}"
          PUB_VERSION=$(grep -m1 '^version:' apps/mobile/pubspec.yaml | sed 's/version:[[:space:]]*//')
          if [ "$PUB_VERSION" != "$VERSION" ]; then
            echo "tag 版本 $VERSION 与 pubspec.yaml $PUB_VERSION 不一致" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION（构建号 $BUILD）"

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定版本而非跟随 stable：Flutter 3.47+ 弃用 material.dart 等入口，
      # 会让 flutter analyze 报出 80+ 条 deprecated_member_use 并使构建失败。
      # 升级前需先把全项目导入迁到 material_ui / cupertino_ui，再一并改这里。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: 获取依赖
        working-directory: apps/mobile
        run: flutter pub get

      - name: 静态检查
        working-directory: apps/mobile
        run: flutter analyze

      - name: 构建 Release APK
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SEMVER: ${{ steps.version.outputs.semver }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          # 只打真机用得到的两个 ABI。universal 包默认还带 x86_64（约 19.8 MB），
          # 那只有模拟器会用；去掉后包体从 ~58 MB 降到 ~48 MB，慢链路下被截断的
          # 概率明显下降——而截断的 APK 装起来正是「安装包未包含任何证书」。
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name "$SEMVER" \
            --build-number "$BUILD"

      # 签名必须来自仓库内的固定密钥（android/keystore/qinglink-release.jks）。
      # 一旦这里退回 debug 密钥，已安装的客户端就会因为签名变化而无法覆盖升级，
      # 所以在发版路径上硬校验指纹，出现偏差就直接失败。
      - name: 校验发布签名
        shell: bash
        env:
          EXPECTED_SHA256: '93:17:DC:EC:24:EE:30:C4:40:F3:BB:27:50:5A:70:E0:0C:46:B0:5F:CA:71:C9:6D:8A:02:6F:AF:A9:D3:08:D7'
        run: |
          set -uo pipefail
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          # GitHub 的 ubuntu 镜像并不导出 ANDROID_HOME，只能按已知安装位置回退；
          # 找不到 apksigner 就报错退出，绝不跳过校验。
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          echo "SDK=$SDK"
          echo "APKSIGNER=${APKSIGNER:-<未找到>}"
          if [ -z "$APKSIGNER" ]; then
            echo "找不到 apksigner，无法校验签名" >&2
            ls -1 "$SDK" 2>/dev/null | head -20 >&2
            exit 1
          fi
          "$APKSIGNER" verify -v --print-certs "$APK" | tee certs.txt
          # apksigner 只在「目标平台需要」时才校验 v1：APK 的 minSdk 是 24，
          # 默认范围下 v1 恒为 false 并不代表没签。要证明 JAR 签名真的存在，
          # 必须把校验范围下探到 21。两个范围各跑一次。
          "$APKSIGNER" verify -v --min-sdk-version 21 "$APK" | tee legacy.txt
          if ! grep -qF 'Verified using v1 scheme (JAR signing): true' legacy.txt; then
            echo "缺少 v1（JAR）签名：APK 里不会有 META-INF/*.RSA，部分安装器会提示没有签名文件" >&2
            exit 1
          fi
          if ! grep -qF 'Verified using v2 scheme (APK Signature Scheme v2): true' certs.txt; then
            echo "缺少 v2 签名" >&2
            exit 1
          fi
          # 部分安装器只认 META-INF 里这套 JAR 签名文件，直接确认它们存在
          if ! unzip -l "$APK" | grep -qE 'META-INF/[A-Z0-9]+\.(RSA|SF)'; then
            echo "APK 内缺少 META-INF 签名文件" >&2
            exit 1
          fi
          # 不同 apksigner 版本输出的前缀不同：老版本是 `Signer #1 certificate ...`，
          # build-tools 37 起变成 `V2 Signer: certificate ...`，所以只匹配字段名。
          grep -E 'certificate (DN|SHA-256 digest)' certs.txt || true
          # 指纹的书写格式各版本不一致：老版本输出大写带冒号，build-tools 37
          # 输出小写不带冒号。统一去掉冒号并转大写后再比。
          ACTUAL=$(grep -E 'certificate SHA-256 digest' certs.txt | head -1 | awk '{print $NF}' \
            | tr '[:lower:]' '[:upper:]' | tr -d ':')
          EXPECTED=$(echo "$EXPECTED_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':')
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "APK 签名指纹不符：" >&2
            echo "  期望 $EXPECTED_SHA256" >&2
            echo "  实际 $ACTUAL" >&2
            echo "请检查 android/key.properties 与 keystore/qinglink-release.jks 是否被正确检出。" >&2
            exit 1
          fi
          echo "签名指纹校验通过：$ACTUAL"

          # 完整性：截断的 APK 仍然能通过签名校验（apksigner 会直接报无法验证），
          # 但更常见的表现是产物本身是坏 zip。这两条能挡在发版之前。
          unzip -t "$APK" > /dev/null || {
            echo "APK 不是完整的 ZIP 包（可能被截断）" >&2
            exit 1
          }
          ZIPALIGN=$(find "$SDK/build-tools" -maxdepth 2 -type f -name zipalign 2>/dev/null | sort -V | tail -1)
          if [ -n "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -v 4 "$APK" > /dev/null || {
              echo "APK 未按 4 字节对齐，v2 签名可能失效" >&2
              exit 1
            }
            echo "zipalign 校验通过"
          else
            echo "找不到 zipalign，跳过对齐校验" >&2
          fi

      - name: 组装发布资产
        id: assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE=release-assets
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          APK_NAME="QingLink-mobile-$VERSION-android.apk"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$STAGE/$APK_NAME"
          # 在 stage 目录内生成清单，保证文件名为裸名（不含路径）。
          # 清单沿用 GNU sha256sum 多行格式，但文件名取 `$APK_NAME.sha256`：
          # 已安装的旧版客户端按「APK 地址 + .sha256」取校验文件，只读第一行；
          # 文件名换成 SHA256SUMS 会让它们直接 404。多行清单对旧客户端无害
          # （首行就是 APK 的哈希），新客户端则按文件名查表。
          (cd "$STAGE" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          APK_BYTES=$(stat -c%s "$STAGE/$APK_NAME")
          APK_SHA=$(awk '{print $1}' "$STAGE/$APK_NAME.sha256")
          {
            echo "apk_name=$APK_NAME"
            echo "apk_bytes=$APK_BYTES"
            echo "apk_sha256=$APK_SHA"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$STAGE"
          echo "字节数 $APK_BYTES，SHA-256 $APK_SHA"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QingLink 移动端 ${{ steps.version.outputs.version }}
          body: |
            移动端版本 `${{ steps.version.outputs.version }}`（构建号 ${{ steps.version.outputs.build }}）。

            - Android：下载 `${{ steps.assets.outputs.apk_name }}` 安装；应用内「检查更新」可直接下载并安装。
            - iOS：GitHub Release 不提供可侧载安装包，应用内检查到更新后会提示前往本页。

            | 项目 | 值 |
            | --- | --- |
            | 文件大小 | `${{ steps.assets.outputs.apk_bytes }}` 字节 |
            | SHA-256 | `${{ steps.assets.outputs.apk_sha256 }}` |

            > 手动下载后安装若提示「安装包未包含任何证书」，九成是文件没下完整（网络中断、
            > 被下载工具截断）。对照上表的字节数，偏小就重新下载；`${{ steps.assets.outputs.apk_name }}.sha256`
            > 是 GNU sha256sum 清单，可自行校验。
          files: release-assets/*
          fail_on_unmatched_files: true
