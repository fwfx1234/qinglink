[package]
name = "qinglink-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "QingLink"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
image.workspace = true
qinglink-protocol = { path = "../../crates/qinglink-protocol" }
qinglink-storage = { path = "../../crates/qinglink-storage" }
qinglink-windows = { path = "../../crates/qinglink-windows" }
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
tracing-appender.workspace = true
resvg.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
usvg.workspace = true

# The tray is implemented directly on the Windows shell APIs, so the Win32
# surface is declared here rather than pulled in through a tray crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "3.0"
sha2.workspace = true

[lints]
workspace = true
