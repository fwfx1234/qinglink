# QingLink 移动端发布签名配置。
#
# 这个文件与 keystore/qinglink-release.jks 是【刻意入库】的：
# Android 只允许「同包名 + 同签名」的 APK 覆盖安装，签名一变，老用户就只能
# 卸载重装（本地数据全丢）。CI 每次都跑在全新的 runner 上，默认的 debug
# 密钥是现生成的（证书 DN 为 CN=Android Debug），发一次版就换一次签名，
# 于是应用内更新必然报签名冲突。
#
# 因此这里固定一份密钥，CI 与本地共用。密钥丢失 = 所有已安装用户永久无法
# 在应用内更新，代价远大于「密钥随源码公开」的风险；更新渠道本身仍受
# GitHub 仓库权限与 Release 内的 SHA256 清单保护。
#
# 需要轮换密钥（例如上架应用商店改用 Play App Signing）时，必须接受
# 老用户卸载重装，并同步改 .github/workflows/mobile-release.yml 里的
# 指纹校验值。
storeFile=keystore/qinglink-release.jks
storePassword=QingLink-Release-2026
keyAlias=qinglink
keyPassword=QingLink-Release-2026
